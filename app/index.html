<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Ledger — GTA VI Trophy Guide &amp; Tracker</title>
<meta name="description" content="Offline guide and tracker for all 55 PlayStation 5 trophies of Grand Theft Auto VI: checklist, five-phase roadmap, missables, and a cited guide for each trophy.">
<link rel="stylesheet" href="css/ledger.css">
</head>
<body>
<header class="site-head">
  <div class="brand">
    <h1>Vice Ledger</h1>
    <p class="tagline">GTA VI trophy guide &amp; tracker · PlayStation 5 · 55 trophies</p>
  </div>
  <div class="head-controls">
    <button id="spoiler-toggle" type="button" class="btn toggle" aria-pressed="false" title="Hide story trophy names, descriptions and grades until earned">Spoiler-safe: off</button>
    <button id="theme-toggle" type="button" class="btn toggle" aria-pressed="false" title="Switch between paper and night themes">Night theme</button>
  </div>
</header>

<section class="hero" id="hero" aria-label="Progress"></section>

<nav class="tabs" aria-label="Guide sections">
  <button type="button" class="tab active" data-view="checklist">Checklist</button>
  <button type="button" class="tab" data-view="roadmap">Roadmap</button>
  <button type="button" class="tab" data-view="missables">Missables <span class="tab-count" id="missable-count"></span></button>
  <button type="button" class="tab" data-view="sources">Sources &amp; Audit</button>
</nav>

<section class="toolbar" id="toolbar" aria-label="Checklist filters">
  <label class="search-box">Search
    <input id="search-input" type="search" placeholder="Name, description or guide…" autocomplete="off">
  </label>
  <label>Kind
    <select id="kind-filter">
      <option value="all">All kinds</option>
      <option value="story">Story</option>
      <option value="missable">Missable</option>
      <option value="collectible">Collectibles</option>
      <option value="activity">Activities</option>
      <option value="stranger">Strangers</option>
      <option value="crime">Crime</option>
      <option value="misc">Misc</option>
      <option value="finale">Finale (platinum &amp; completion)</option>
    </select>
  </label>
  <label>Grade
    <select id="grade-filter">
      <option value="all">All grades</option>
      <option value="platinum">Platinum</option>
      <option value="gold">Gold</option>
      <option value="silver">Silver</option>
      <option value="bronze">Bronze</option>
    </select>
  </label>
  <label class="check-label"><input id="hide-earned" type="checkbox"> Hide earned</label>
  <span class="toolbar-spacer"></span>
  <span class="result-count" id="result-count"></span>
  <button id="export-btn" type="button" class="btn">Export progress</button>
  <button id="import-btn" type="button" class="btn">Import progress</button>
  <button id="reset-btn" type="button" class="btn danger">Reset progress</button>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
</section>

<main id="view" class="view"></main>

<footer class="audit-strip" id="audit-strip" aria-label="Audit strip"></footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
